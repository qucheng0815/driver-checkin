<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理后台 - 司机签到系统</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- 登录页 -->
  <div id="loginPage">
    <div class="login-box">
      <h2>🔐 管理后台</h2>
      <form onsubmit="return handleLogin(event)">
        <div class="form-group">
          <input type="password" id="adminPwd" placeholder="请输入管理密码" required>
        </div>
        <button type="submit" class="btn-submit">登 录</button>
      </form>
    </div>
  </div>

  <!-- 管理主页 -->
  <div id="adminPage" class="admin-container" style="display:none">
    <h1 class="page-title">📊 管理后台</h1>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('current', this)">当前在场</button>
      <button class="tab-btn" onclick="switchTab('history', this)">历史记录</button>
    </div>

    <!-- 当前在场 -->
    <div id="tab-current">
      <p style="color:#888;margin-bottom:12px;" id="currentCount"></p>
      <table class="data-table" id="currentTable">
        <thead>
          <tr>
            <th>车牌号</th>
            <th>姓名</th>
            <th>公司</th>
            <th>到场时间</th>
          </tr>
        </thead>
        <tbody id="currentBody"></tbody>
      </table>
      <div id="currentEmpty" class="empty-tip" style="display:none">当前无在场车辆</div>
    </div>

    <!-- 历史记录 -->
    <div id="tab-history" style="display:none">
      <div class="filter-bar">
        <input type="date" id="filterDate">
        <button onclick="loadHistory(1)">查询</button>
        <button onclick="clearFilter()" style="background:#999">清除</button>
      </div>
      <table class="data-table" id="historyTable">
        <thead>
          <tr>
            <th>车牌号</th>
            <th>姓名</th>
            <th>公司</th>
            <th>手机号</th>
            <th>到场时间</th>
            <th>离场时间</th>
            <th>状态</th>
          </tr>
        </thead>
        <tbody id="historyBody"></tbody>
      </table>
      <div id="historyEmpty" class="empty-tip" style="display:none">暂无记录</div>
      <div class="pagination" id="paginationBar" style="display:none">
        <button id="btnPrev" onclick="changePage(-1)">上一页</button>
        <span id="pageInfo"></span>
        <button id="btnNext" onclick="changePage(1)">下一页</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="/js/admin.js"></script>
</body>
</html>
